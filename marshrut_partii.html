<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр по безопасности для кладовщика — 8 точек</title>
<style>
  /* ============ БАЗА ============ */
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%;
    overflow:hidden;                       /* требование: нигде нет скроллов */
    background:linear-gradient(135deg,#0b1220 0%,#16233c 55%,#1b2b46 100%);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#1e293b;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ ОКНО ТРЕНАЖЁРА (100vw, max-height 600px) ============ */
  #app{
    position:relative;
    width:100vw;                           /* требование: относительная ширина 100vw */
    height:600px;
    max-height:600px;                      /* требование: макс. высота 600px */
    margin:0 auto;
    overflow:hidden;
    background:#eef2f7;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    display:flex; flex-direction:column;
  }

  /* Масштабируемая сцена: логические размеры задаёт JS,
     высота — естественная (контент), ширина тоже пересчитывается */
  #stage{
    position:absolute;
    top:0; left:0;
    transform-origin:top left;
    will-change:transform,width;
  }
  #canvas{
    width:100%;
    height:auto;
    display:flex; flex-direction:column;
    overflow:visible;
    background:#eef2f7;
  }
  /* вертикальная подложка, чтобы фон сцены заполнял контейнер */
  #canvas::after{ content:""; }

  /* ============ УЗКИЙ РЕЖИМ (одна колонка) ============ */
  #canvas.narrow .topbar{
    height:auto; min-height:50px; gap:6px 8px; padding:7px 12px;
    flex-wrap:wrap; align-items:center;
  }
  #canvas.narrow .brand{ order:1; min-width:0; }
  #canvas.narrow .brand .sub{ display:none; }
  #canvas.narrow .brand h1{ font-size:13.5px; white-space:normal; line-height:1.2; }
  #canvas.narrow .brand .logo{ font-size:22px; }
  #canvas.narrow .stageTag{ order:2; margin-left:auto; }
  #canvas.narrow .dot{ width:21px; height:21px; font-size:11px; }
  #canvas.narrow .dots{ order:3; gap:5px; margin-left:0; flex:0 0 100%; }
  #canvas.narrow .stageTag{ font-size:10px; padding:4px 7px; }
  #canvas.narrow .work{
    grid-template-columns:1fr; gap:9px; padding:9px 12px 7px;
  }
  #canvas.narrow .card{ padding:11px 13px; border-radius:13px; }
  #canvas.narrow .cardIcon{ width:36px; height:36px; font-size:20px; border-radius:10px; }
  #canvas.narrow .cardTitle{ font-size:14.5px; }
  #canvas.narrow .bodyText{ font-size:13.5px; line-height:1.4; }
  #canvas.narrow .qbox{ font-size:13.5px; padding:9px 11px; }
  #canvas.narrow .ansBtn{ padding:11px 0; font-size:15px; }
  #canvas.narrow .feedback{ font-size:12.5px; min-height:17px; }
  #canvas.narrow .footer{ height:50px; padding:0 12px; gap:10px; }
  #canvas.narrow .navBtn{ padding:9px 14px; font-size:13px; }
  #canvas.narrow .hint{ display:none; }
  #canvas.narrow .finalWork{ gap:8px; padding:9px 12px 7px; }
  #canvas.narrow .finalHero{ padding:10px 12px; gap:10px; border-radius:13px; }
  #canvas.narrow .finalHero h2{ font-size:14.5px; }
  #canvas.narrow .finalHero p{ font-size:11.5px; }
  #canvas.narrow .finalHero .ficon{ font-size:24px; }
  #canvas.narrow .scoreBadge{ padding:6px 11px; }
  #canvas.narrow .scoreBadge .num{ font-size:19px; }
  #canvas.narrow .stepsRow{ grid-template-columns:1fr 1fr; gap:8px; }
  #canvas.narrow .step{ padding:9px 10px; border-radius:11px; }
  #canvas.narrow .step .sDesc{ font-size:11.8px; }
  #canvas.narrow .step .sTitle{ font-size:12.8px; }
  #canvas.narrow .finalText{ padding:10px 12px; border-radius:11px; gap:6px; }
  #canvas.narrow .finalText p{ font-size:12.8px; line-height:1.38; }
  #canvas.narrow .finalText .rule{ font-size:12.5px; padding:8px 11px; }

  /* ============ ШАПКА ============ */
  .topbar{
    flex:0 0 auto;
    height:58px;
    background:linear-gradient(90deg,#101c30,#1c3155);
    color:#fff;
    display:flex; align-items:center; gap:18px;
    padding:0 20px;
    border-bottom:3px solid #f59e0b;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand .logo{ font-size:26px; line-height:1; }
  .brand h1{
    font-size:17px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  }
  .brand .sub{ font-size:11.5px; color:#9fb4d4; white-space:nowrap; }

  .dots{ display:flex; gap:7px; margin-left:auto; align-items:center; }
  .dot{
    width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.06);
    color:#c6d4ea; font-size:12.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .18s ease;
    font-family:inherit;
  }
  .dot:hover{ border-color:#f59e0b; color:#fff; }
  .dot.done{ background:#16a34a; border-color:#16a34a; color:#fff; }
  .dot.cur{ background:#f59e0b; border-color:#fbbf24; color:#1a2436; transform:scale(1.12); box-shadow:0 0 0 4px rgba(245,158,11,.25); }
  .dot.locked{ cursor:default; opacity:.55; }
  .dot.locked:hover{ border-color:rgba(255,255,255,.28); color:#c6d4ea; }

  .stageTag{
    flex:0 0 auto;
    font-size:12px; font-weight:700; letter-spacing:.6px;
    color:#fbbf24; background:rgba(245,158,11,.14);
    border:1px solid rgba(245,158,11,.45);
    padding:5px 11px; border-radius:999px; white-space:nowrap;
  }

  /* ============ РАБОЧАЯ ОБЛАСТЬ ============ */
  .work{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    padding:16px 20px 10px;
  }
  .card{
    background:#fff;
    border:1px solid #dbe3ee;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(15,35,70,.08);
    padding:16px 18px;
    display:flex; flex-direction:column;
    min-height:0; overflow:hidden;
  }
  .cardHead{ display:flex; align-items:center; gap:11px; margin-bottom:9px; flex:0 0 auto; }
  .cardIcon{
    width:44px; height:44px; border-radius:12px; flex:0 0 auto;
    background:linear-gradient(135deg,#fff3d6,#ffe1a8);
    border:1px solid #f3d089;
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .kicker{
    font-size:11px; font-weight:800; letter-spacing:1.4px; color:#b45309;
    text-transform:uppercase;
  }
  .cardTitle{ font-size:16.5px; font-weight:800; color:#0f1f38; line-height:1.25; }

  .bodyText{ font-size:14.5px; line-height:1.48; color:#334155; }
  .bodyText p + p{ margin-top:8px; }

  .situation{ flex:1 1 auto; overflow:hidden; }
  .situation .bodyText{ margin-bottom:11px; }

  .qbox{
    flex:0 0 auto;
    background:linear-gradient(90deg,#fff8ec,#fef3df);
    border:1px solid #f2d9a7; border-left:5px solid #f59e0b;
    border-radius:12px; padding:11px 14px;
    font-size:15px; font-weight:600; color:#7c3f06; line-height:1.4;
  }
  .qbox .qmark{ color:#d97706; margin-right:6px; }

  .answers{ flex:0 0 auto; display:flex; gap:12px; margin-top:12px; }
  .ansBtn{
    flex:1; padding:13px 0; border-radius:12px; cursor:pointer;
    font-size:17px; font-weight:800; font-family:inherit;
    border:2px solid #26364f; background:#fff; color:#26364f;
    transition:all .16s ease;
  }
  .ansBtn:hover{ background:#26364f; color:#fff; }
  .ansBtn:disabled{ cursor:default; }
  .ansBtn.pickYes{ background:#dc2626; border-color:#dc2626; color:#fff; }
  .ansBtn.pickNo { background:#16a34a; border-color:#16a34a; color:#fff; }
  .ansBtn.dim{ opacity:.45; }
  .ansBtn.shake{ animation:shake .4s; }
  @keyframes shake{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)}
    50%{transform:translateX(7px)} 75%{transform:translateX(-4px)}
  }

  .feedback{
    flex:0 0 auto; margin-top:10px; font-size:13.5px; font-weight:700;
    min-height:20px; line-height:1.35;
  }
  .feedback.bad{ color:#dc2626; }
  .feedback.good{ color:#15803d; }

  /* Правая карточка — разбор */
  .analysis .cardIcon{ background:linear-gradient(135deg,#dcfce7,#bbf7d0); border-color:#86efac; }
  .analysis .kicker{ color:#15803d; }
  .verdict{
    flex:0 0 auto; border-radius:11px; padding:9px 13px; margin-bottom:10px;
    font-size:14px; font-weight:800; line-height:1.35; display:flex; gap:9px; align-items:center;
  }
  .verdict.ok{ background:#dcfce7; border:1px solid #86efac; color:#14532d; }
  .verdict.no{ background:#fee2e2; border:1px solid #fca5a5; color:#7f1d1d; }
  .analysisText{ flex:1 1 auto; overflow:hidden; }
  .analysisText p{ font-size:14px; line-height:1.46; color:#334155; }
  .analysisText p + p{ margin-top:9px; }
  .analysisText p b{ color:#b91c1c; }
  .analysisText p .ok{ color:#15803d; font-weight:700; }

  .placeholder{
    flex:1 1 auto; border:2px dashed #cbd5e1; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:#94a3b8; text-align:center; padding:10px;
  }
  .placeholder .phIcon{ font-size:34px; }
  .placeholder .phText{ font-size:13.5px; font-weight:600; line-height:1.4; }

  /* ============ НИЖНЯЯ ПАНЕЛЬ ============ */
  .footer{
    flex:0 0 auto;
    height:58px;
    background:#fff;
    border-top:1px solid #dbe3ee;
    display:flex; align-items:center; gap:14px;
    padding:0 20px;
  }
  .navBtn{
    font-family:inherit; cursor:pointer;
    font-size:14px; font-weight:700;
    border-radius:10px; padding:11px 20px;
    border:2px solid #26364f; background:#fff; color:#26364f;
    transition:all .15s ease; white-space:nowrap;
  }
  .navBtn:hover:not(:disabled){ background:#26364f; color:#fff; }
  .navBtn.go{ background:#f59e0b; border-color:#f59e0b; color:#1a2436; }
  .navBtn.go:hover:not(:disabled){ background:#d97706; border-color:#d97706; color:#fff; }
  .navBtn:disabled{ opacity:.4; cursor:not-allowed; }
  .progressWrap{ flex:1 1 auto; display:flex; flex-direction:column; gap:5px; min-width:0; }
  .progressMeta{ display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; color:#64748b; }
  .progressTrack{ height:8px; border-radius:99px; background:#e2e8f0; overflow:hidden; }
  .progressFill{ height:100%; border-radius:99px; background:linear-gradient(90deg,#f59e0b,#16a34a); width:0%; transition:width .35s ease; }
  .hint{ font-size:12.5px; color:#94a3b8; font-weight:600; white-space:nowrap; }

  /* ============ ИТОГОВЫЙ ЭКРАН ============ */
  .finalWork{ padding:16px 20px 10px; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:12px; }
  .finalHero{
    flex:0 0 auto; background:linear-gradient(90deg,#101c30,#1c3155);
    border-radius:16px; padding:13px 18px; color:#fff;
    display:flex; align-items:center; gap:16px; border-bottom:3px solid #f59e0b;
  }
  .finalHero .ficon{ font-size:30px; }
  .finalHero h2{ font-size:18px; font-weight:800; line-height:1.25; }
  .finalHero p{ font-size:12.5px; color:#b9c8e0; margin-top:2px; line-height:1.35; }
  .scoreBadge{
    margin-left:auto; flex:0 0 auto; text-align:center;
    background:rgba(245,158,11,.16); border:1px solid rgba(245,158,11,.5);
    border-radius:14px; padding:8px 16px;
  }
  .scoreBadge .num{ font-size:24px; font-weight:900; color:#fbbf24; line-height:1; }
  .scoreBadge .lbl{ font-size:10.5px; color:#c6d4ea; margin-top:3px; font-weight:700; letter-spacing:.5px; }

  .stepsRow{ flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .step{
    background:#fff; border:1px solid #dbe3ee; border-radius:14px;
    padding:11px 13px; box-shadow:0 4px 12px rgba(15,35,70,.07);
    position:relative; overflow:hidden;
  }
  .step::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:linear-gradient(180deg,#f59e0b,#16a34a);
  }
  .step .sTop{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .step .sNum{
    width:24px; height:24px; border-radius:50%; background:#1c3155; color:#fbbf24;
    font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .step .sIcon{ font-size:20px; }
  .step .sTitle{ font-size:14px; font-weight:800; color:#0f1f38; }
  .step .sDesc{ font-size:12.3px; line-height:1.4; color:#475569; }

  .finalText{
    flex:1 1 auto; background:#fff; border:1px solid #dbe3ee; border-radius:14px;
    padding:12px 16px; display:flex; flex-direction:column; justify-content:center; gap:8px;
    box-shadow:0 4px 12px rgba(15,35,70,.07); overflow:hidden;
  }
  .step{ min-height:0; }
  .finalText p{ font-size:13.8px; line-height:1.42; color:#334155; }
  .finalText .rule{
    background:#fef3df; border:1px solid #f2d9a7; border-left:5px solid #f59e0b;
    border-radius:10px; padding:9px 13px; font-size:13.5px; font-weight:700; color:#7c3f06; line-height:1.4;
  }

  /* ============ РЕСАЙЗЕР ============ */
  #grip{
    position:absolute; right:0; bottom:0;
    width:30px; height:30px; z-index:50;
    cursor:ns-resize;
    display:flex; align-items:flex-end; justify-content:flex-end;
    padding:3px;
    touch-action:none;
  }
  #grip::after{
    content:""; width:14px; height:14px;
    border-right:3px solid #26364f; border-bottom:3px solid #26364f;
    border-radius:0 0 4px 0; opacity:.55;
  }
  #grip:hover::after{ border-color:#f59e0b; opacity:1; }
  #sizeTip{
    position:absolute; right:40px; bottom:6px; z-index:51;
    background:#101c30; color:#fbbf24; font-size:11.5px; font-weight:700;
    padding:4px 10px; border-radius:8px; display:none; pointer-events:none;
    font-variant-numeric:tabular-nums;
  }

  /* Анимация смены экрана (только прозрачность — без сдвига, чтобы
     не искажать метрики layout при авто-масштабировании) */
  .screen{ animation:fadeIn .32s ease; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <div id="canvas"><!-- контент рендерит JS --></div>
  </div>
  <div id="sizeTip">600px</div>
  <div id="grip" title="Потяните, чтобы изменить высоту тренажёра (двойной клик — сброс)"></div>
</div>

<script>
/* ================================================================
   ДАННЫЕ: 8 точек — текст полностью из методического файла
   ================================================================ */
const STAGES = [
  {
    icon:"🚛",
    title:"Выбираем место до открытия кузова",
    situation:"Автомобиль стоит у рампы. Водитель говорит, что торопится, а обозначенное место ожидания частично занято пустыми поддонами. Погрузчик ещё не начал работу.",
    question:"Можно ли кладовщику встать сбоку от ворот, если он хорошо видит водителя?",
    analysis:[
      "<b>Нет.</b> Хороший обзор не заменяет безопасное место и свободный маршрут. Кладовщик не начинает свою часть приёмки, сообщает о перекрытом месте ожидания и остаётся вне пространства между транспортом, рампой и техникой.",
      "Перед открытием кузова пустые поддоны перемещают уполномоченные работники в предусмотренное место. <span class='ok'>Только после восстановления условий операция продолжается по локальному порядку.</span>"
    ]
  },
  {
    icon:"🪵",
    title:"Решаем судьбу повреждённого поддона",
    situation:"После открытия кузова видно, что плёнка на первом поддоне порвана, верхний короб выступает, а одна нижняя доска треснула. Под поддоном сухо, маркировка товара читается.",
    question:"Следует ли аккуратно поднять поддон на несколько сантиметров, чтобы проверить его прочность?",
    analysis:[
      "<b>Нет.</b> Пробный подъём может разрушить опору и превратить потенциальное падение в реальное. Кладовщик не входит со стороны наклона, предупреждает участников операции и сообщает ответственному признаки повреждения.",
      "Обычную разгрузку возобновляют только после выбора безопасного способа: например, переупаковки, укрепления или применения подходящего приспособления по установленной технологии. Сам кладовщик не назначает способ, если это выходит за его полномочия."
    ]
  },
  {
    icon:"🛒",
    title:"Выбираем между руками и тележкой",
    situation:"На втором поддоне лежат коробки по 9 кг. Их нужно переместить женщине-кладовщику в зону контроля качества, операция повторится около двадцати раз за час.",
    question:"Можно ли переносить коробки вручную, если каждая легче 10 кг?",
    analysis:[
      "<b>Нет.</b> Предел 10 кг относится к подъёму и перемещению при чередовании с другой работой до двух раз в час. При постоянной работе в течение смены предел для женщин составляет 7 кг, поэтому выбирают предусмотренную тележку или меняют организацию процесса.",
      "Перед применением тележки проверяют её грузоподъёмность, исправность и соответствие коробкам. <span class='ok'>Норма массы не заменяет проверку захвата, обзора и маршрута.</span>"
    ]
  },
  {
    icon:"📦",
    title:"Загружаем тележку и сохраняем управление",
    situation:"Тележка исправна и рассчитана на груз. Если установить шесть коробок высокой колонной, они поместятся по массе, но закроют обзор вперёд.",
    question:"Стоит ли уменьшить скорость и вести такую тележку, выглядывая сбоку?",
    analysis:[
      "<b>Нет.</b> Допустимая грузоподъёмность — только одно условие. Груз должен занимать устойчивое положение в пределах платформы, не падать при движении и позволять контролировать маршрут.",
      "Кладовщик уменьшает высоту загрузки или выполняет несколько рейсов по технологии. Он не удерживает верхний короб рукой во время движения и не использует плёнку как способ исправить неустойчивую компоновку на ходу."
    ]
  },
  {
    icon:"🚜",
    title:"Пересекаем маршрут погрузчика",
    situation:"На пути в зону хранения разметка пешеходного перехода видна, но обзор справа закрывает временный штабель. Сигнал работающего погрузчика слышен за стеллажом.",
    question:"Можно ли медленно выдвинуть переднюю часть тележки в проезд, чтобы водитель заметил груз?",
    analysis:[
      "<b>Нет.</b> Тележка не должна становиться «щупом», а водитель может не успеть остановиться. Кладовщик остаётся перед границей проезда, использует установленный порядок перехода и сообщает о закрытом обзоре.",
      "Если безопасный маршрут временно недоступен, операция ожидает восстановления условий или выполняется по другому согласованному пути. Самовольный обход через рабочую зону погрузчика не становится безопасным из-за короткого расстояния."
    ]
  },
  {
    icon:"🗄️",
    title:"Реагируем на след удара по стеллажу",
    situation:"В нужной секции на нижней стойке видна свежая царапина и небольшой изгиб. Табличка нагрузки читается, а соседние поддоны стоят ровно.",

    analysis:[

/* ================================================================

/* ================================================================

   ================================================================ */
function dotsHTML(){
  let h = "";
  for(let i=0;i<8;i++){
    const cls = ["dot",
      i===state.idx ? "cur" : "",
      state.answers[i] ? "done" : "",
      i>state.maxReached ? "locked" : ""
    ].join(" ").trim();
    h += `<button class="${cls}" data-jump="${i}" ${i>state.maxReached?"disabled":""}>${i+1}</button>`;
  }
  return h;
}

    document.getElementById("backBtn").addEventListener("click", ()=>{ state.idx=7; render(); });

      state.idx=0; state.answers=new Array(8).fill(null); state.maxReached=0; render();
    });
    canvas.querySelectorAll(".dot[data-jump]").forEach(d=>{
      d.addEventListener("click", ()=>{ state.idx = +d.dataset.jump; render(); });
    });
  }
  scheduleFit();
}

function answer(choice){
  state.answers[state.idx] = choice;
  if(state.idx>state.maxReached) state.maxReached = state.idx;
  if(choice==="yes"){
    // неверный ответ — мгновенная подсветка и сообщение, затем разбор
    const yes = canvas.querySelector('[data-ans="yes"]');
    const no  = canvas.querySelector('[data-ans="no"]');
    const fb  = document.getElementById("feedback");
    yes.classList.add("pickYes","shake"); no.classList.add("dim");
    yes.disabled = true; no.disabled = true;
    fb.className = "feedback bad";
    fb.textContent = "⛔ Ошибка. Правильный ответ — «НЕТ». Открываем разбор…";
    setTimeout(render, 800);
  }else{
    render();
  }
}

/* ================================================================
   АВТО-МАСШТАБИРОВАНИЕ (без скроллов и потери контента)
   Сцена имеет естественную высоту (по контенту) и логическую ширину.
   На широких экранах — две колонки, на узких (порог 760 логических px)
   — одна колонка и более компактные отступы. Метод перебором
   подбирает МАКСИМАЛЬНЫЙ масштаб, при котором сцена целиком
   вписывается в окно и ни один текст не обрезается.
   ================================================================ */
const MAX_LOGIC_W  = 1500;   // ширина сцены на больших мониторах
const MIN_LOGIC_W  = 320;    // минимальная логическая ширина (иначе ничего не влезет)
const NARROW_BREAK = 900;    // порог одноколоночного режима
const APP_MAX_H    = 600;    // ограничение высоты тренажёра

function fit(){
  const cw = app.clientWidth;
  const ch = app.clientHeight;

  // Перебор от крупного масштаба к мелкому — первый подходящий и есть лучший.
  // Верхний предел: ширина не уже MIN_LOGIC_W и масштаб не больше 1.5.
  const scaleMax = Math.min(1.5, cw / MIN_LOGIC_W);

  let best = null;
  for(let s = Math.floor(scaleMax*1000)/1000; s >= 0.20; s -= 0.015){
    // логическая ширина сцены под этот масштаб
    const lw = Math.min(cw / s, MAX_LOGIC_W);

    // режим раскладки: одна колонка на узких экранах
    canvas.classList.toggle("narrow", lw < NARROW_BREAK);

    stage.style.width = lw + "px";
    stage.style.transform = `scale(${s})`;
    stage.style.left = "0px";
    stage.style.top  = "0px";
    // принудительный синхронный пересчёт layout после смены размеров
    void canvas.offsetHeight;

    // 1) вся сцена вписывается в окно
    const contentH = canvas.offsetHeight;
    if(contentH * s > ch + 1) continue;

    // 2) ширина сцены не вылезает за окно
    if(lw * s > cw + 1) continue;

    // 3) ни один текст не обрезается внутри карточек
    let clipped = false;
    const els = canvas.querySelectorAll(".mustfit");
    for(const el of els){
      if(el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1){
        clipped = true; break;
      }
    }
    if(clipped) continue;

    best = { s, lw, contentH };
    break;
  }

  if(!best){ best = { s:0.20, lw:Math.min(cw/0.20, MAX_LOGIC_W), contentH:ch }; }

  // финальная установка с центровкой
  canvas.classList.toggle("narrow", best.lw < NARROW_BREAK);
  stage.style.width = best.lw + "px";
  stage.style.transform = `scale(${best.s})`;
  void canvas.offsetHeight;
  const contentH = canvas.offsetHeight;
  const visualW = best.lw * best.s;
  stage.style.left = ((cw - visualW)/2) + "px";
  stage.style.top  = "0px";   // контент прижат к верху, без пустого провала сверху
}

// Масштабируем после полного расчёта layout (иначе метрики «сырые»)
function scheduleFit(){
  requestAnimationFrame(()=>requestAnimationFrame(fit));
}
// ResizeObserver вызывает fit после реальной раскладки и при изменении размера окна
new ResizeObserver(()=>fit()).observe(app);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fit); }
window.addEventListener("load", fit);

/* ================================================================
   ВСТРОЕННЫЙ РЕСАЙЗЕР (перетаскивание, высота 260..600px)
   ================================================================ */
const grip = document.getElementById("grip");
const tip  = document.getElementById("sizeTip");

const maxH = ()=> Math.min(600, window.innerHeight);
const MIN_H = 260;

function setH(h){
  h = Math.round(Math.min(Math.max(h, MIN_H), maxH()));
  app.style.height = h + "px";
  tip.textContent = h + " px";
  fit();
  return h;
}

let dragging = false, startY = 0, startH = 0;
grip.addEventListener("pointerdown", e=>{
  dragging = true;
  startY = e.clientY;
  startH = app.clientHeight;
  grip.setPointerCapture(e.pointerId);
  tip.style.display = "block";
});
grip.addEventListener("pointermove", e=>{
  if(!dragging) return;
  setH(startH + (e.clientY - startY));
});
grip.addEventListener("pointerup", ()=>{
  dragging = false;
  tip.style.display = "none";
  try{ localStorage.setItem("trainerH", app.clientHeight); }catch(_){}
});
grip.addEventListener("dblclick", ()=>{ setH(600); try{localStorage.removeItem("trainerH");}catch(_){} });

window.addEventListener("resize", ()=>{ setH(app.clientHeight); });

/* ================================================================
   СТАРТ
   ================================================================ */
(function init(){
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem("trainerH")||"0",10) || 0; }catch(_){}
  const h = saved ? Math.min(saved, maxH()) : maxH();
  app.style.height = h + "px";
  render();
})();
</script>
